<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <!-- Senin numarana ait CSS dosyası eklendi -->
    <link rel="stylesheet" href="css/2416501056.css">
</head>
<body>

    <!-- MENÜ BÖLÜMÜ -->
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa - Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <!-- GÜNCELLEME FORMU -->
        <section class="form-alani">
            <h2>Etkinlik Güncelle</h2>
            <form action="#" method="POST">
                
                <!-- Güncellenecek Etkinliği Seçmek için bir alan eklenebilir -->
                <div class="form-grup">
                    <label for="guncellenecek-etkinlik">Güncellenecek Etkinliği Seçin</label>
                    <select id="guncellenecek-etkinlik" name="guncellenecek-etkinlik" required>
                        <option value="">Seçiniz</option>
                        <option value="1">Kariyer Günleri</option>
                        <option value="2">Robotik Atölyesi</option>
                        <option value="3">Siber Güvenlik</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="ad">Etkinlik Adı</label>
                    <!-- value ile mevcut bilgi gösterilebilir (örnek amaçlı dolu) -->
                    <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026" required>
                </div>
                
                <div class="form-grup">
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori" required>
                        <option value="">Seçiniz</option>
                        <!-- selected ile mevcut kategori seçili gelir -->
                        <option value="seminer" selected>Seminer</option>
                        <option value="atolye">Atölye</option>
                        <option value="soylesi">Söyleşi</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="tarih">Tarih</label>
                    <!-- value ile tarih önceden dolu geliyor -->
                    <input type="date" id="tarih" name="tarih" value="2026-10-12" required>
                </div>

                <div class="form-grup">
                    <label for="aciklama">Açıklama</label>
                    <!-- İçerik dolu geliyor -->
                    <textarea id="aciklama" name="aciklama" rows="3">A Blok Salonu, saat 14:00'te.</textarea>
                </div>

                <!-- Buton metni 'Güncelle' olarak değiştirildi -->
                <button type="submit">Güncelle</button>
            </form>
        </section>
    </main>

</body>
</html>
