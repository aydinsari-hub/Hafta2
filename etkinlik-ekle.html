<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle</title>
  <link rel="stylesheet" href="./css/2416501056.css">
  <script type="module" src="./js/event-form.js"></script>
</head>
<body>
  <header class="ust-bilgi">
    <div class="kapsayici">
      <h1>Etkinlik Ekle</h1>
      <nav class="ana-menu">
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html" class="aktif">Ekle</a>
      </nav>
    </div>
  </header>

  <main class="kapsayici">
    <p class="form-aciklama">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

    <!-- novalidate çok önemli, html5 uyarılarını kapatır, bizim javascripti çalıştırır -->
    <form id="etkinlik-formu" novalidate class="form-kapsayici">
      <div class="form-grup">
        <label for="ad">Etkinlik Adı *</label>
        <input type="text" id="ad" name="ad">
        <span id="ad-hata" class="hata-metin"></span>
      </div>

      <div class="form-grup">
        <label for="kategori">Kategori *</label>
        <select id="kategori" name="kategori">
          <option value="">Seçiniz</option>
          <option value="Seminer">Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
        </select>
        <span id="kategori-hata" class="hata-metin"></span>
      </div>

      <div class="form-grup">
        <label for="tarih">Tarih *</label>
        <input type="date" id="tarih" name="tarih">
        <span id="tarih-hata" class="hata-metin"></span>
      </div>

      <div class="form-grup">
        <label for="saat">Saat *</label>
        <input type="time" id="saat" name="saat">
        <span id="saat-hata" class="hata-metin"></span>
      </div>

      <div class="form-grup">
        <label for="yer">Yer *</label>
        <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu">
        <span id="yer-hata" class="hata-metin"></span>
      </div>

      <div class="form-grup">
        <label for="kontenjan">Kontenjan</label>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
        <span id="kontenjan-hata" class="hata-metin"></span>
      </div>

      <div class="form-grup">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="4"></textarea>
      </div>

      <button type="submit" class="btn">Kaydet</button>
    </form>

    <div id="form-mesaj"></div>
  </main>

  <footer class="alt-bilgi">
    <p>Aydın · 2416501056 · 2026</p>
  </footer>
</body>
</html>
